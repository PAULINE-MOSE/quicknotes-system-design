<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>

    <button id="load-btn" type="button">Load notes</button>
    <p id="status" role="status"></p>

    <form id="note-form">
      <label for="title-input">Title (required, max 100 characters)</label>
      <input id="title-input" type="text" maxlength="100">

      <label for="body-input">Body (optional)</label>
      <textarea id="body-input" rows="3"></textarea>

      <button id="submit-btn" type="submit">Add note</button>
    </form>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
